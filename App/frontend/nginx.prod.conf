# 운영(OCI)용 nginx 설정. docker-compose.prod.yml이 이 파일을
# /etc/nginx/conf.d/default.conf 자리에 bind-mount 한다.
# 로컬 개발은 nginx.conf(5173, HTTP)를 그대로 쓴다.
#
# 인증서 경로에 도메인이 안 들어가는 이유: 호스트에서
#   /etc/letsencrypt/live/current -> /etc/letsencrypt/live/<도메인>
# 심볼릭 링크를 만들어 두기 때문이다 (scripts/init-letsencrypt.sh가 생성).
# 덕분에 이 파일은 도메인을 몰라도 되고, 도메인이 바뀌어도 링크만 다시 걸면 된다.

server {
    listen 80;
    server_name _;

    # ACME 챌린지는 HTTPS로 리다이렉트하면 안 된다. certbot이 평문 80으로 검증한다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/current/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/current/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # 비밀번호 재설정 링크가 /reset-password?token=... 형태라 URL 자체가 비밀을 담는다.
    # 브라우저 기본값도 교차 출처로는 경로·쿼리를 안 보내지만, 기본 동작에 기대지 않고 명시한다.
    # always를 붙여야 에러 응답에도 나간다.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # compose 내부 DNS. 재시작으로 IP가 바뀌어도 따라가도록 변수로 둔다.
    resolver 127.0.0.11 valid=10s;

    # 회의록 오디오/문서 업로드가 있어 기본값(1m)으로는 막힌다.
    # Spring의 multipart max-request-size(120MB)에 맞춘다.
    client_max_body_size 120M;

    location /api/ {
        set $backend_upstream backend-spring:8080;
        # proxy_pass 호스트가 변수라 location 접두사 자동 치환이 꺼짐 — $request_uri로 원본 경로를 직접 붙여야 함
        proxy_pass http://$backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $proxy_add_x_forwarded_for는 클라이언트가 보낸 X-Forwarded-For를 지우지 않고 뒤에 덧붙인다.
        # Spring이 forward-headers-strategy=framework로 이 헤더의 맨 왼쪽 값을 getRemoteAddr()로 쓰기
        # 때문에, 덧붙이면 클라이언트가 자기 IP를 마음대로 위조할 수 있다. 계정 복구 레이트 리밋이
        # 그 값을 키로 쓰므로 덮어써서 nginx가 실제로 관측한 주소만 남긴다.
        #
        # 전제: 이 nginx가 엣지다(80/443을 직접 게시하고 앞에 LB·CDN이 없다). 앞단에 로드밸런서나
        # Cloudflare를 붙이면 $remote_addr이 그 프록시 IP로 고정돼 모든 사용자가 같은 레이트 리밋
        # 버킷에 묶이고, 계정 복구가 광범위하게 429로 막힌다. 그때는 이 줄만 되돌리지 말고
        # real_ip 모듈로 신뢰 대역을 명시할 것:
        #   set_real_ip_from <LB CIDR>;  real_ip_header X-Forwarded-For;  real_ip_recursive on;
        # 그러면 $remote_addr이 진짜 클라이언트 IP가 되어 아래 줄이 그대로 옳다.
        proxy_set_header X-Forwarded-For $remote_addr;
        # 이게 없으면 Spring이 OAuth 리다이렉트 URL을 http://로 만들어 로그인이 깨진다.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # index.html은 배포마다 새 자산 해시를 참조하므로 캐시되면 안 됨(캐시되면 새로고침 전까지 옛 화면이 보임).
    # 해시가 붙은 /assets/*.js, *.css는 이 지시 없이도 브라우저가 안전하게 오래 캐시해도 된다.
    # 이게 없으면 응답에 Cache-Control이 아예 없어 브라우저가 Last-Modified 기반 휴리스틱 캐싱을 한다.
    #
    # Referrer-Policy를 여기서 다시 선언하는 이유: nginx는 자식 블록에 add_header가 하나라도 있으면
    # 상속받은 서버 레벨 add_header를 전부 버린다. 아래 try_files 폴백이 이 블록으로 내부 재진입하므로,
    # 다시 선언하지 않으면 하필 /reset-password?token=... 응답에서 Referrer-Policy가 사라진다.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires -1;
    }

    location / {
        try_files $uri /index.html;
    }
}
