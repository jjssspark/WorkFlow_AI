name: Redis ACL/compose checks

# 이 스크립트는 501줄짜리 ACL·compose 방어선인데 **CI 어디에도 없었다.** 그 사이 조용히
# 세 군데가 썩었다(2026-08-02 확인).
#   - spring / fastapi ACL 줄 고정 문자열 2건: 2026-07-30 권한 보강을 따라가지 않음
#   - 롤백 대상 문자열 1건: deploy-previous -> deploy-last-good 이름 변경을 따라가지 않음
# 마지막 것은 스크립트를 그 줄에서 죽여, 뒤따르는 롤백 순서 검사가 통째로 도달조차 못 했다.
# 즉 "있는 척하는 방어선"이었다. 돌지 않는 테스트는 없는 것보다 나쁘다 - 있다고 믿게 만든다.
on:
  pull_request:
  push:
    branches: [dev]

  # deploy-oci.yml 이 배포 게이트로 호출한다(fastapi-tests.yml 과 같은 방식).
  workflow_call:

# paths 필터를 일부러 걸지 않는다. 이 스크립트는 ACL 템플릿뿐 아니라 docker-compose,
# .env.example, deploy-oci.yml, Lua 스크립트, Java 발행기까지 걸쳐 단언한다. 좁게 걸면
# 이번에 발견된 것과 똑같은 사고 - 배포 워크플로 쪽 이름이 바뀌었는데 필터에 안 걸려
# 검사가 안 도는 - 가 그대로 재발한다. 정적 검사만 도는 데 몇 초면 끝난다.

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # RUN_REDIS_SMOKE=0 은 정적 단언만 돌린다. 실제 컨테이너를 띄우는 스모크는
      # 러너에서 Redis 이미지를 받아야 해 느리고, 배포 게이트로 쓰기에는 무겁다.
      # 스모크는 서버에서 손으로 돌린다(App/DEPLOY_OCI.md).
      - name: Run Redis ACL/compose static checks
        env:
          RUN_REDIS_SMOKE: '0'
        run: bash App/tests/test_redis_compose.sh
