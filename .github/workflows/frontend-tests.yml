name: Frontend tests

# 백엔드는 CI가 막아주는데 프론트엔드는 아무것도 실행하지 않았다. 그래서
# src/global/lib/evalStatus.ts가 .gitignore의 lib/ 규칙에 걸려 누락된 채 머지됐고,
# pnpm build가 "Could not resolve"로 깨진 코드가 dev와 main을 그대로 통과했다.
# 운영 배포가 며칠간 조용히 실패했다(2026-07-25). 머지 전에 잡는다.
on:
  pull_request:
    paths:
      - 'App/frontend/**'
      - '.github/workflows/frontend-tests.yml'
  push:
    branches: [dev, main]
    paths:
      - 'App/frontend/**'
      - '.github/workflows/frontend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App/frontend
    steps:
      - uses: actions/checkout@v4

      # pnpm 버전은 package.json의 packageManager(pnpm@10.34.5)를 그대로 따른다.
      - name: Enable corepack
        run: corepack enable
        working-directory: .

      # 의도적으로 cache: pnpm 을 쓰지 않는다. setup-node가 post 단계에서 pnpm store
      # 경로를 찾지 못해 스텝이 failure로 남는다(캐시는 저장되지도 않는다).
      # 전체 실행이 1분 이내라 캐시 이득보다 게이트가 항상 초록인 편이 낫다.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # --frozen-lockfile: package.json과 락파일이 어긋나면 여기서 실패한다.
      # 이 불일치로도 배포가 깨진 적이 있다(2026-07-24, @testing-library/dom).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # vite/vitest는 타입을 검사하지 않고 트랜스파일만 한다. 그래서 tsconfig가 없던
      # 동안 타입 오류 60건이 이 CI를 그대로 통과했다 - 회의록 AI가 만든 업무 카드가
      # Task의 필수 필드 3개를 빠뜨리거나, API가 줄 수 없는 role 값으로 테스트하는
      # 것들이 섞여 있었다. 빌드보다 앞에 두는 이유는 미해결 import를 rollup의
      # "Could not resolve"보다 정확한 파일·줄 번호로 알려주기 때문이다.
      - name: Type check
        run: pnpm typecheck

      # 운영 이미지와 동일한 빌드. 미해결 import는 여기서 잡힌다.
      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test
